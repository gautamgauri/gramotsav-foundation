<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Gramotsav Foundation">
  <rect width="120" height="120" rx="26" fill="#2E3A72"/>
  <!-- marigold sun / folk rosette -->
  <g transform="translate(60,50)">
    <g fill="#E8A128">
      <circle r="15"/>
      <g id="r">
        <path d="M0,-17 l4.2,-9 -8.4,0 z"/>
      </g>
      <use href="#r" transform="rotate(45)"/><use href="#r" transform="rotate(90)"/>
      <use href="#r" transform="rotate(135)"/><use href="#r" transform="rotate(180)"/>
      <use href="#r" transform="rotate(225)"/><use href="#r" transform="rotate(270)"/>
      <use href="#r" transform="rotate(315)"/>
    </g>
    <circle r="6.5" fill="#C6543C"/>
  </g>
  <!-- the manch (stage) -->
  <rect x="24" y="80" width="72" height="9" rx="4.5" fill="#3E9E9B"/>
  <!-- the mitti (earth) -->
  <path d="M20 98 q40 -10 80 0 v6 h-80 z" fill="#C6543C"/>
</svg>
